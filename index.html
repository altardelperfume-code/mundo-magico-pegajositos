<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>El Mundo Mágico de los Pegajositos Ecológicos</title>
  <meta name="description" content="Aventura educativa infantil: explora un mundo mágico con los Pegajositos Ecológicos y aprende valores y cuidado del planeta jugando.">
  <meta name="theme-color" content="#1f9d63">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/mundo/bienvenida.webp">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-screen="inicio">
  <a class="skip" href="#screen">Saltar al juego</a>

  <header class="hud">
    <a class="brand" href="#inicio" aria-label="Inicio">
      <img src="assets/personajes/romina.webp" alt="">
      <span>Pegajositos<small>Ecológicos</small></span>
    </a>
    <div class="hud-stats">
      <span class="pill" title="Estrellas"><span aria-hidden="true">⭐</span><b id="hud-stars">0</b><span class="sr">estrellas</span></span>
      <span class="pill" title="Puntos"><span aria-hidden="true">💎</span><b id="hud-points">0</b><span class="sr">puntos</span></span>
      <span class="hud-progress" id="hud-progress" role="progressbar" aria-label="Progreso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="hud-bar"></span></span>
      <button class="pill sound" id="btn-sound" aria-pressed="true"><span class="ico" aria-hidden="true">🔊</span><span class="lbl">Sonido</span></button>
    </div>
  </header>

  <main id="screen" tabindex="-1"></main>

  <nav class="dock" aria-label="Navegación principal">
    <a href="#inicio" data-route="inicio"><span aria-hidden="true">🏠</span>Inicio</a>
    <a href="#mapa" data-route="mapa"><span aria-hidden="true">🗺️</span>Explorar</a>
    <a href="#personajes" data-route="personajes"><span aria-hidden="true">🫶</span>Personajes</a>
    <a href="#logros" data-route="logros"><span aria-hidden="true">🏆</span>Mis logros</a>
  </nav>

  <div id="modal" class="modal" hidden tabindex="-1"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <noscript>Esta aventura necesita JavaScript activado para funcionar.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
